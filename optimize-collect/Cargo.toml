[package]
name = "optimize-collect"
description = "Paired comparison collector for spider-optimize. Never published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "optimize-collect"
path = "src/main.rs"

[dependencies]
spider-cloud-agent = { workspace = true, features = ["optimize"] }
spider-optimize = { workspace = true }
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
# For `manifest.salt_id`. Already in the lockfile through the CLI.
sha2 = "0.10"
