# Review this policy and Cargo.lock together when dependencies change.
[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause",
         "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "deny"
# The locked graph needs these older versions alongside newer consumers.
# Exact versions keep new duplicates subject to review. No dependency tree is exempt.
skip = [
    # security-framework.
    { name = "core-foundation", version = "=0.9.4" },
    # sha2.
    { name = "cpufeatures", version = "=0.2.17" },
    # ring.
    { name = "getrandom", version = "=0.2.17" },
    # spider-cloud-agent.
    { name = "getrandom", version = "=0.3.4" },
    # jni.
    { name = "jni-sys", version = "=0.3.1" },
    # getrandom.
    { name = "r-efi", version = "=5.3.0" },
    # keyring.
    { name = "security-framework", version = "=2.11.1" },
